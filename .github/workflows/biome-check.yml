name: Biome Check

on:
  push:
    branches:
      - main
      - 'fix/issue-*'
      - 'test/issue-*'
      - 'chore/issue-*'
  pull_request:

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run zero-install Biome lint pass
        run: npx --yes @biomejs/biome@1.9.4 check freeforge/src tests/security tests/helpers
